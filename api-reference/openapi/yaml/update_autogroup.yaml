openapi: 3.0.0
info:
  title: Update Workergroup API
  description: API endpoint to update an existing workergroups
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/workergroups/{id}/:
    put:
      summary: update workergroup
      description: |
        Updates the properties of an existing workergroup based on the provided parameters. Fields you omit are left unchanged.

        CLI Usage: `vastai update workergroup <id> [options]`
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the workergroup to update.
        schema:
          type: integer
          example: 4242
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
              - endpoint_id
              properties:
                endpoint_id:
                  type: integer
                  description: ID of the endpoint the workergroup belongs to.
                  example: 123
                template_hash:
                  type: string
                  description: Template hash for the workergroup.
                  example: abc123def456
                template_id:
                  type: integer
                  description: Template ID for the workergroup.
                  example: 456
                search_params:
                  type: string
                  description: Search filters for offers, as a query string or JSON object. Merged into the workergroup's current filters; where both set the same filter, this value wins.
                  example: gpu_name=RTX_3090 rentable=true
                launch_args:
                  type: string
                  description: Launch arguments for creating instances.
                  example: "--env VAR=value"
                gpu_ram:
                  type: number
                  description: Estimated GPU memory, in GB, that the model needs. Used to estimate worker load times.
                  example: 24
      responses:
        '200':
          description: Successfully updated the workergroup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: invalid_args
                  msg:
                    type: string
                    example: Workgroup not found for user
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  msg:
                    type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: API requests too frequent endpoint threshold=2.0
      tags:
      - Serverless
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
x-rate-limit:
  threshold: 2.0
  per: request
  description: Maximum request frequency per IP address for this endpoint
x-cli-commands:
- name: update workergroup
  description: Update a workergroup
  endpoint: /api/v0/workergroups/{id}/
  method: PUT
  example: vastai update workergroup 4242 --min_load 1.5 --target_util 0.8