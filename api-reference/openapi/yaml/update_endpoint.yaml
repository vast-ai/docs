openapi: 3.0.0
info:
  title: Update Endpoint API
  description: API for updating an existing endpoint group
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/endptjobs/{id}/:
    put:
      summary: update endpoint
      description: |
        Updates the specified endpoint group with the provided parameters. Fields you omit are left unchanged. For what each parameter controls, see [Endpoint Parameters](/guides/serverless/serverless-parameters).

        CLI Usage: `vastai update endpoint <id> [options]`
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of the endpoint group to update
        schema:
          type: integer
          example: 4242
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                min_load:
                  type: number
                  description: Minimum floor load in perf units/s (token/s for LLMs)
                  example: 0.0
                target_util:
                  type: number
                  description: Target capacity utilization (fraction, max 1.0)
                  example: 0.9
                cold_mult:
                  type: number
                  description: Cold/stopped instance capacity target as multiple of hot capacity target
                  example: 2.5
                cold_workers:
                  type: integer
                  description: Min number of workers to keep 'cold' when you have no load
                  example: 5
                max_workers:
                  type: integer
                  description: Max number of workers your endpoint group can have
                  example: 20
                min_cold_load:
                  type: number
                  description: Floor on the load used to size the total pool of active and inactive workers, in load per second
                  minimum: 0
                  example: 0.0
                max_queue_time:
                  type: number
                  description: Maximum seconds of expected queue time allowed to build up on each worker
                  exclusiveMinimum: 0
                  example: 30.0
                target_queue_time:
                  type: number
                  description: Endpoint-wide queue time, in seconds, above which the serverless engine scales up aggressively
                  exclusiveMinimum: 0
                  example: 10.0
                inactivity_timeout:
                  type: number
                  description: Seconds without queued or in-progress requests after which active workers are stopped down to the `min_load` floor. Can be changed but not removed once set.
                  exclusiveMinimum: 0
                  example: 600
                endpoint_state:
                  type: string
                  description: Set to `suspended` or `stopped` to pause the serverless engine, or `active` to resume it. See [Pricing](/guides/serverless/pricing) for how each state is billed.
                  enum:
                  - active
                  - suspended
                  - stopped
                  example: active
                endpoint_name:
                  type: string
                  description: Deployment endpoint name
                  example: my_endpoint
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: invalid_args
                  msg:
                    type: string
                    example: "Endpointgroup not found for user"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  msg:
                    type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: API requests too frequent endpoint threshold=2.0
      tags:
      - Serverless
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
x-rate-limit:
  threshold: 2.0
  per: request
  description: Maximum request frequency per IP address for this endpoint
x-cli-commands:
- name: update endpoint
  description: Update an existing endpoint group
  endpoint: /api/v0/endptjobs/{id}/
  method: PUT
  example: vastai update endpoint 4242 --min_load 100 --target_util 0.9 --cold_mult 2.0 --endpoint_name "vLLM-Qwen3-8B"