openapi: 3.0.0
info:
  title: Get Workergroup Logs API
  description: Retrieve logs for a specific workergroup
  version: 1.0.0
paths:
  /get_workergroup_logs/:
    post:
      servers:
      - url: https://run.vast.ai
        description: Production server
      summary: get workergroup logs
      description: |
        Retrieves logs for a specific workergroup by ID.

        The response contains one string per log level. Each level keeps up to about 16 MB of recent history; use `tail` to choose how much of it to return.

        CLI Usage: `vastai get wrkgrp-logs <id> [--level <0-3>] [--tail <bytes>]`
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  description: ID of the workergroup
                  default: 12345
                  example: 12345
                  minimum: 1
                tail:
                  type: integer
                  description: Number of bytes to return from the end of each log
                  default: 10000
                  example: 100000
                  minimum: 1
      responses:
        '200':
          description: Logs successfully retrieved.
          content:
            application/json:
              schema:
                oneOf:
                - title: Success - Logs Retrieved
                  type: object
                  properties:
                    info0:
                      type: string
                      description: User log, shown as **User** in the console. Worker creation, starts, stops, state changes with their reasons, worker errors, and PyWorker stack traces.
                      example: "Worker 67890: model_loading -> idle (received loadtime)\n"
                    info1:
                      type: string
                      description: Info-level engine log, shown as **Info** in the console. Includes the user log plus additional scaling details.
                    debug:
                      type: string
                      description: Debug-level engine log
                    trace:
                      type: string
                      description: Trace-level engine log, the most detailed level
                - title: Error Response
                  type: object
                  properties:
                    error_msg:
                      type: string
                      description: Returned when the workergroup does not exist or the API key does not own it
                      example: "autogroup 12345 not found or unauthorized"
      tags:
      - Serverless
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
x-cli-commands:
- name: get wrkgrp-logs
  description: Retrieve logs for a specific workergroup
  endpoint: /get_workergroup_logs/
  method: POST
  example: 'curl -X POST https://run.vast.ai/get_workergroup_logs/ -H "Authorization: Bearer YOUR_API_KEY" -H "Content-Type: application/json" -d ''{"id": 12345, "tail": 100000}'''
