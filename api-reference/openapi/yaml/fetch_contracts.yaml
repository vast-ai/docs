openapi: 3.0.0
info:
  title: Fetch Contracts API
  description: API endpoint to look up your rental contracts by ID
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/contracts/fetch/:
    post:
      summary: fetch contracts
      description: |
        Returns the rental contracts (instances and volumes) with the given IDs, optionally filtered by label. Only contracts you rent as a client are returned. IDs that don't exist or belong to someone else are skipped silently. At most 4096 contracts are returned.

        Each contract is returned as its full stored record, so the set of fields can change over time. Use [show instance](/api-reference/instances/show-instance) for a stable view of a single instance.

        To list the contracts on a machine you host, use [show machine contracts](/api-reference/machines/show-machine-contracts) instead.

        CLI Usage: `vastai show invoices --instance-label <label>` uses this endpoint to filter invoices by instance label.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contract_ids
              properties:
                contract_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                  description: IDs of the contracts to fetch. Must be a non-empty list.
                  example:
                  - 1234567
                  - 1234568
                label:
                  type: string
                  description: Only return contracts with exactly this label.
                  example: my-training-run
      responses:
        '200':
          description: The matching contracts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  contracts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: A contract record. Commonly used fields are listed; other stored fields may also be present.
                      properties:
                        id:
                          type: integer
                          description: Contract ID. For instances, this is the instance ID.
                          example: 1234567
                        label:
                          type: string
                          nullable: true
                          description: Label set on the instance.
                          example: my-training-run
                        client_id:
                          type: integer
                          description: User ID of the renter (you).
                        host_id:
                          type: integer
                          description: User ID of the host.
                        start_date:
                          type: number
                          nullable: true
                          description: Contract start time (Unix timestamp).
                        end_date:
                          type: number
                          nullable: true
                          description: Contract end time (Unix timestamp).
        '400':
          description: '`contract_ids` is missing, empty, or not a list.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: invalid_args
                msg: contract_ids must be a non-empty list
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            text/plain:
              schema:
                type: string
                example: API requests too frequent
      tags:
      - Instances
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        msg:
          type: string
x-rate-limit:
  threshold: 2.0
  per: request
  description: Maximum request frequency per IP address for this endpoint
