openapi: 3.0.0
info:
  title: Get Endpoint Workers API
  description: Monitor and retrieve the current status of workers for a specific endpoint
  version: 1.0.0
paths:
  /get_endpoint_workers/:
    post:
      servers:
      - url: https://run.vast.ai
        description: Production server
      summary: get endpoint workers
      description: |
        Retrieves the current list and status of workers for a specific endpoint.
        Useful for monitoring, debugging connectivity issues, and understanding resource usage.

        The response is a JSON array with one object per worker. To receive the same data as a push stream instead of polling, see [Streaming Worker Status](/guides/serverless/worker-status-websocket).

        CLI Usage: `vastai get endpt-workers <id>`
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  description: ID of the endpoint to monitor
                  default: 12345
                  example: 12345
                  minimum: 1
      responses:
        '200':
          description: Successfully retrieved endpoint workers.
          content:
            application/json:
              schema:
                oneOf:
                - title: Success - Workers Retrieved
                  type: array
                  description: List of workers for this endpoint
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Worker instance ID
                        example: 67890
                      gpu_name:
                        type: string
                        description: GPU model of the worker's machine
                        example: "RTX 4090"
                      num_gpus:
                        type: integer
                        description: Number of GPUs allocated to the worker
                        example: 1
                      perf:
                        type: number
                        description: Performance (load per second) the serverless engine expects from this worker when planning capacity. Unavailable and Offline workers count for a fraction of their full performance, and workers that are in Error or being destroyed count for `0`.
                        example: 812.4
                      measured_perf:
                        type: number
                        description: Performance (load per second) measured on this worker
                        example: 830.1
                      reliability:
                        type: number
                        description: Share of routed requests that the worker has completed, from 0 to 1. Reset to 1 each time the worker starts.
                        example: 0.98
                      dlperf:
                        type: number
                        description: DLPerf score of the worker's machine
                        example: 105.6
                      cur_perf:
                        type: number
                        description: Current throughput of the worker, in load per second
                        example: 640.2
                      new_load:
                        type: number
                        description: Load assigned to the worker since its last status report
                        example: 0
                      cur_load:
                        type: number
                        description: Load currently assigned to the worker that has not completed yet
                        example: 1500
                      cur_load_rolling_avg:
                        type: number
                        description: Smoothed load per second handled by the worker
                        example: 580.7
                      reqs_working:
                        type: integer
                        description: Number of requests currently assigned to the worker
                        example: 3
                      loaded_at:
                        type: number
                        description: Unix timestamp (seconds) when the worker became ready after its most recent start, or `0` if it is not ready yet
                        example: 1760000000.0
                      ready_ever:
                        type: boolean
                        description: Whether the worker has been ready at least once since it was created or since its last template update
                        example: true
                      started_at:
                        type: number
                        description: Unix timestamp (seconds) when the worker was last started
                        example: 1759999700.0
                      disk_usage:
                        type: number
                        description: Disk space used by the worker's model, as reported by the worker
                        example: 16.2
                      status:
                        type: string
                        description: Current worker state. See [Worker States](/guides/serverless/worker-states).
                        enum:
                        - pending
                        - creating
                        - created
                        - loading
                        - model_loading
                        - idle
                        - starting
                        - stopping
                        - stopped
                        - rebooting
                        - unavail
                        - offline
                        - error
                        - destroying
                        - update_ready
                        - update_rebooting
                        - update_starting
                        - unknown
                        example: "idle"
                      available:
                        type: boolean
                        description: Whether the worker's machine can currently run it. An inactive worker whose GPUs are rented by someone else reports `false`.
                        example: true
                      outdated:
                        type: boolean
                        description: Whether the worker is running an older PyWorker version than the latest stable release
                        example: false
                      hidden:
                        type: boolean
                        description: Whether the worker is a replacement that is still being prepared. Hidden workers do not receive requests.
                        example: false
                      contract_end_date:
                        type: number
                        description: Unix timestamp (seconds) when the worker's rental contract ends, or `0` if it has no end date
                        example: 0
                      replaces_worker_id:
                        type: integer
                        description: ID of the worker this worker is replacing before its contract ends, or `0` if it is not a replacement
                        example: 0
                - title: Error Response
                  type: object
                  properties:
                    error_msg:
                      type: string
                      description: Returned when the endpoint does not exist or the API key does not own it
                      example: "endpoint 12345 not found or unauthorized"
      tags:
      - Serverless
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
x-cli-commands:
- name: get endpt-workers
  description: Monitor workers for a specific endpoint
  endpoint: /get_endpoint_workers/
  method: POST
  example: 'curl -X POST https://run.vast.ai/get_endpoint_workers/ -H "Authorization: Bearer YOUR_API_KEY" -H "Content-Type: application/json" -d ''{"id": 12345}'''
