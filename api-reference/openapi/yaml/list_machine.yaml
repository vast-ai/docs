openapi: 3.0.0
info:
  title: Vast.ai Machine List API
  description: API endpoint for listing machines for rent on the vast.ai platform.
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/machines/create_asks/:
    put:
      summary: list machine
      description: |
        Creates or updates ask contracts for a machine to list it for rent on the vast.ai platform.
        Allows setting offer pricing, rental types, end dates, discount rates, and SLA parameters.

        SLA request-body fields (`sla_r_target`, `sla_r_claim`, `sla_sigma_x`) are supported on this REST endpoint. The published CLI and SDK do not yet expose them — use the host console (**Set Pricing → SLA**) or REST/`curl` until CLI/SDK support ships.

        CLI Usage (non-SLA fields): `vastai list machine <machine_id> [options]`
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - machine
              properties:
                machine:
                  type: integer
                  description: ID of the machine to list
                price_gpu:
                  type: number
                  format: float
                  description: Price per GPU per hour
                price_disk:
                  type: number
                  format: float
                  description: Price per GB of disk storage
                price_inetu:
                  type: number
                  format: float
                  description: Price per GB of upload bandwidth
                price_inetd:
                  type: number
                  format: float
                  description: Price per GB of download bandwidth
                price_min_bid:
                  type: number
                  format: float
                  description: Minimum bid price allowed
                min_chunk:
                  type: integer
                  description: Minimum number of GPUs that must be rented together
                  default: 1
                end_date:
                  type: number
                  format: float
                  description: Unix timestamp for when the listing expires
                credit_discount_max:
                  type: number
                  format: float
                  description: Maximum discount rate allowed for prepaid credits
                sla_r_target:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 0.9999
                  description: |
                    Client reliability coverage target. Values above 0 enable SLA on the offer.
                    Must be greater than 0 and at most 0.9999 when enabling SLA; exactly 1.0 is rejected.
                    Set to 0 to disable SLA. Legacy alias: sla_reliability.
                sla_r_claim:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 0.9999
                  description: |
                    Host reliability claim. Must be greater than 0, at most 0.9999, and greater than or equal to sla_r_target.
                    Defaults to sla_r_target if omitted.
                sla_sigma_x:
                  type: number
                  format: float
                  description: |
                    Host confidence spread — how wide your belief is around the claim.
                    Must be greater than 0 and at most 3.0. Defaults to 0.5.
                sla_reliability:
                  type: number
                  format: float
                  description: Legacy alias for sla_r_target.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  you_sent:
                    type: object
                    description: Echo of the request body
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        machine_id:
                          type: integer
                        user_id:
                          type: integer
                        extended:
                          type: integer
                          description: Number of rental contracts extended
                        new_contracts:
                          type: array
                          items:
                            type: integer
                          description: IDs of newly created contracts
                        upd_contracts:
                          type: array
                          items:
                            type: integer
                          description: IDs of updated contracts
                example:
                  success: true
                  you_sent:
                    machine: 12345
                    sla_r_target: 0.95
                  results:
                  - machine_id: 12345
                    user_id: 67890
                    extended: 1
                    new_contracts: []
                    upd_contracts: [1]
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_args
                    - invalid_sla_params
                    example: invalid_sla_params
                  msg:
                    type: string
                    example: No such machine(s) for your account
        '401':
          description: Unauthorized — missing permission or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  msg:
                    type: string
                    example: Your key lacks the machine_write permission group
        '403':
          description: Forbidden — machine locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - machine_locked
                    example: machine_locked
                  msg:
                    type: string
                    example: Machine is decommissioned or migration-locked
      tags:
      - Machines
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication with API key in Authorization header
