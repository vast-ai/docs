openapi: 3.0.0
info:
  title: Create Workergroup API
  description: Creates a new workergroup configuration for serverless endpoints
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/workergroups/:
    post:
      summary: create workergroup
      description: |
        Creates a new workergroup configuration that manages worker instances for a serverless endpoint.

        CLI Usage: `vastai create workergroup --template_hash <hash> --endpoint_name <name> [options]`
      security:
      - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
              - search_params
              properties:
                endpoint_id:
                  type: integer
                  description: ID of the endpoint this workergroup belongs to. Either `endpoint_id` or `endpoint_name` is required.
                  example: 123
                endpoint_name:
                  type: string
                  description: Name of the endpoint this workergroup belongs to. Either `endpoint_id` or `endpoint_name` is required. If you have no endpoint with this name, one is created with default parameters.
                  example: vLLM-Qwen3-8B
                template_hash:
                  type: string
                  description: Hash ID of template to use for worker instances
                  example: abc123def456
                template_id:
                  type: integer
                  description: ID of template (alternative to template_hash)
                  example: 456
                search_params:
                  type: string
                  description: Search filters for the offers that workers are recruited from, as a query string or JSON object. Combined with any search filters defined by the template; where both set the same filter, this value wins.
                  example: gpu_name=RTX_3090 rentable=true
                launch_args:
                  type: string
                  description: Additional launch arguments for worker instances
                  example: "--env VAR=value"
                gpu_ram:
                  type: number
                  description: Estimated GPU memory, in GB, that the model needs. Used to estimate worker load times; to filter offers by GPU memory, use `search_params`.
                  default: 8
                  exclusiveMinimum: 0
                  example: 24
      responses:
        '200':
          description: Successfully created workergroup
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    description: ID of created autoscaling job
                    example: 789
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    enum:
                    - invalid_args
                  msg:
                    type: string
                    example: Please assign your workergroup to a valid endpoint identifier
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: API requests too frequent endpoint threshold=4.0
      tags:
      - Serverless
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        msg:
          type: string
x-rate-limit:
  threshold: 4.0
  per: request
  description: Maximum request frequency per IP address
x-cli-commands:
- name: create workergroup
  description: Create a new workergroup
  endpoint: /api/v0/workergroups/
  method: POST
  example: vast-ai create workergroup --template_hash abc123 --endpoint_name "vLLM-Qwen3-8B"
