openapi: 3.0.0
info:
  title: Create API Key
  description: 'Creates a new API key with restricted permissions that can be shared
    with other users and teammates.

    The permissions must be specified in a JSON file format.

    '
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/auth/apikeys/:
    post:
      summary: create api-key
      description: |
        Creates a new API key with specified permissions for the authenticated user.

        A key may be given a lifetime, and may bind the `$name` parameters its permissions mention.
        A key created with another key ends no later than that key and keeps that key's parameter bindings.

        CLI Usage: `vastai create api-key --name <name> --permission_file <permissions_file> [--lifetime_sec <seconds>] [--key_params <json>]`
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name for the API key
                  example: read-only-key
                permissions:
                  type: object
                  description: JSON object containing permission definitions
                  example:
                    read: true
                    write: false
                key_params:
                  type: object
                  description: >-
                    Binds the `$name` parameters the permissions mention. A constraint
                    `{"id": {"eq": "$instance_id"}}` with `{"$instance_id": 1234}` pins the key to
                    instance 1234. Names start with `$`. Every `$name` in the permissions must be bound.
                    Parameters are bound when the key is created: the key is stored with the resulting
                    permissions, and a key created with it stays within them.
                  additionalProperties: true
                  example:
                    $instance_id: 1234
                lifetime_sec:
                  type: number
                  minimum: 60
                  maximum: 315360000
                  description: >-
                    Seconds the key lives. The key ends no later than the key it is created with.
                    Omit for a key with no expiry of its own.
                  example: 3600
      responses:
        '200':
          description: API key created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: The ID of the created API key
                    example: 12345
                  key:
                    type: string
                    description: The newly generated API key
                    example: vast-123456789abcdef
                  expires_at:
                    type: number
                    nullable: true
                    description: Unix time at which the key stops working, or null for a key with no expiry
                    example: 1767229200.0
                  permissions:
                    anyOf:
                    - type: boolean
                      description: False when permissions are disabled
                      example: false
                    - type: object
                      description: Object defining the permissions when enabled
                      example:
                        read: true
                        write: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    enum:
                    - invalid_permissions
                    - missing_permissions
                    - unbound_key_param
                    - invalid_key_params
                  msg:
                    type: string
                    example: Invalid permission format
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  msg:
                    type: string
                    example: Unauthorized
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: API requests too frequent endpoint threshold=2.0
      tags:
      - Accounts
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
x-rate-limit:
  threshold: 2.0
  per: request
  description: Maximum request frequency per IP address for this endpoint
x-input-validation:
  permissions:
    description: Must be valid JSON object defining allowed permissions
    example:
      read: true
      write: false
  name:
    max_length: 255
    description: Optional name to identify the API key
  key_params:
    description: Object whose names start with `$`; binds the `$name` parameters in the permissions
  lifetime_sec:
    description: Seconds, 60 to 315360000 (ten years)
x-cli-commands:
- name: create api-key
  description: Create a new API key with restricted permissions
  endpoint: /api/v0/auth/apikeys/
  method: POST
  example: vast create api-key --name "read-only" --permission_file permissions.json --lifetime_sec 3600
