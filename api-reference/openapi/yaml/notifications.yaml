openapi: 3.0.0
info:
  title: Vast.ai Notifications API
  description: Manage notification types, preferences, in-app notifications, and notification webhooks.
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/notification-types/:
    get:
      summary: list notification types
      description: |
        List the notification types available to the authenticated user, including their display names, contexts, topics, and default channel settings.
      security:
      - BearerAuth: []
      tags:
      - Notifications
      responses:
        '200':
          description: Notification types returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notification_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationType'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v0/users/{user_id}/notification-prefs/:
    get:
      summary: get notification preferences
      description: Read notification preferences for the authenticated user.
      security:
      - BearerAuth: []
      tags:
      - Notifications
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the authenticated user.
      responses:
        '200':
          description: Notification preferences returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notification_preferences:
                    $ref: '#/components/schemas/NotificationPreferences'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: update notification preferences
      description: Replace notification preferences for the authenticated user.
      security:
      - BearerAuth: []
      tags:
      - Notifications
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notification_preferences
              properties:
                notification_preferences:
                  $ref: '#/components/schemas/NotificationPreferences'
            example:
              notification_preferences:
                client:
                  low_credit:
                    email: true
                    webhooks: false
      responses:
        '200':
          description: Notification preferences updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notification_preferences:
                    $ref: '#/components/schemas/NotificationPreferences'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
