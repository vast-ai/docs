openapi: 3.0.0
info:
  title: Create Endpoint API
  description: 'This API allows users to create a new endpoint for job processing.


    CLI Usage: vast-ai create endpoint

    '
  version: 1.0.0
servers:
- url: https://console.vast.ai
  description: Production server
paths:
  /api/v0/endptjobs/:
    post:
      summary: create endpoint
      description: |
        This endpoint creates a new job processing endpoint with specified parameters.

        CLI Usage: `vastai create endpoint [options]`
      security:
      - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint_name:
                  type: string
                  description: Name of the endpoint. Must be unique among your endpoints. If omitted, a random 8-character name is generated.
                  minLength: 1
                  maxLength: 512
                  example: "my_endpoint"
                min_load:
                  type: number
                  description: Minimum active capacity to maintain, in load per second. `0` allows the endpoint to scale to zero active workers.
                  default: 0.0
                  minimum: 0
                  example: 50.0
                min_cold_load:
                  type: number
                  description: Floor on the load used to size the total pool of active and inactive workers, in load per second.
                  default: 0.0
                  minimum: 0
                  example: 0.0
                target_util:
                  type: number
                  description: Target ratio of anticipated load to active capacity. Lower values keep more spare capacity.
                  default: 0.9
                  minimum: 0
                  maximum: 1
                  example: 0.75
                cold_mult:
                  type: number
                  description: Total capacity (active and inactive) to maintain, as a multiple of the active capacity target.
                  default: 3.0
                  minimum: 0
                  exclusiveMaximum: 100
                  example: 2.0
                cold_workers:
                  type: integer
                  description: Minimum number of workers (active and inactive) to maintain. Shown as **Minimum Workers** in the console. Must not be greater than `max_workers`.
                  default: 5
                  minimum: 0
                  example: 5
                max_workers:
                  type: integer
                  description: Maximum number of workers (active and inactive) the serverless engine will recruit.
                  default: 20
                  minimum: 0
                  example: 20
                max_queue_time:
                  type: number
                  description: Maximum seconds of expected queue time allowed to build up on each worker before new requests wait in the endpoint queue.
                  default: 30.0
                  exclusiveMinimum: 0
                  example: 30.0
                target_queue_time:
                  type: number
                  description: Endpoint-wide queue time, in seconds, above which the serverless engine scales up aggressively. Must not be greater than `max_queue_time`.
                  default: 10.0
                  exclusiveMinimum: 0
                  example: 10.0
                inactivity_timeout:
                  type: number
                  description: Seconds without queued or in-progress requests after which active workers are stopped down to the `min_load` floor. Not set by default. Once set, it can be changed but not removed.
                  exclusiveMinimum: 0
                  example: 600
                endpoint_state:
                  type: string
                  description: Initial state of the endpoint.
                  enum:
                  - active
                  - suspended
                  - stopped
                  default: active
                  example: active
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  result:
                    type: integer
                    description: The ID of the created endpoint
                    example: 12345
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                  properties:
                    error:
                      type: string
                      enum:
                      - invalid_args
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: API requests too frequent endpoint threshold=4.0
      tags:
      - Serverless
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key must be provided in the Authorization header
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        msg:
          type: string
x-rate-limit:
  threshold: 4
  per: request
  description: Maximum request frequency per IP address for this endpoint
x-input-validation:
  min_load:
    description: Must be a number greater than or equal to 0.
  min_cold_load:
    description: Must be a number greater than or equal to 0.
  target_util:
    description: Must be a number from 0 to 1.
  cold_mult:
    description: Must be a number greater than or equal to 0 and less than 100.
  cold_workers:
    description: Must be a non-negative integer, no greater than max_workers.
  max_workers:
    description: Must be a non-negative integer.
  max_queue_time:
    description: Must be a number greater than 0.
  target_queue_time:
    description: Must be a number greater than 0, no greater than max_queue_time.
  inactivity_timeout:
    description: Must be a number greater than 0.
  endpoint_name:
    max_length: 512
    description: Must be 1 to 512 characters, without shell metacharacters or control characters, and unique among your endpoints.
x-cli-commands:
- name: Create Endpoint
  description: Create a new endpoint for job processing.
  endpoint: /api/v0/endptjobs/
  method: POST
  example: vast-ai create endpoint --min_load 0.5 --target_util 0.75 --cold_mult 1.0
    --cold_workers 2 --max_workers 10 --endpoint_name "vLLM-Qwen3-8B"
